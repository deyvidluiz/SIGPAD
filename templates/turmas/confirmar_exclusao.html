{% extends 'base.html' %}

{% block title %}Excluir Turma | Planejamento PCC{% endblock %}
{% block page_title %}Excluir turma{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <p>Tem certeza que deseja excluir a turma <strong>{{ turma.nome }}</strong>?</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'turma_detalhes' turma.id %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Excluir Conteudo | Planejamento PCC{% endblock %}
{% block page_title %}Excluir conteudo{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <p>Confirma a exclusao do conteudo <strong>{{ conteudo.titulo }}</strong>?</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'conteudo_detalhes' conteudo.id %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}

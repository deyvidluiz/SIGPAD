{% extends 'base.html' %}

{% block title %}Excluir Disciplina | Planejamento PCC{% endblock %}
{% block page_title %}Excluir disciplina{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <p>Confirma a exclusao da disciplina <strong>{{ disciplina.nome }}</strong>?</p>
        <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'disciplina_detalhes' disciplina.id %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
